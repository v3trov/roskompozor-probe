# Isolated trial virtual host. Real DNS for these names is never changed.
# Only this exact diagnostic URI serves data; there is no proxy/upstream.
limit_req_zone $binary_remote_addr zone=probe_control_rate:1m rate=6r/s;
limit_conn_zone $binary_remote_addr zone=probe_control_connections:1m;
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # Exact production virtual hosts keep precedence. Unknown SNI names select
    # this static control; HTTP Host is always probe-control.roskompozor.ru.
    server_name probe-control.roskompozor.ru ~^[a-zA-Z0-9.-]+$;
    ssl_certificate /data/nginx/custom/probe-next/cert.pem;
    ssl_certificate_key /data/nginx/custom/probe-next/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /dev/null crit;
    gzip off;
    keepalive_timeout 0;
    client_max_body_size 1k;
    location = /probe-control/65536 {
        limit_req zone=probe_control_rate burst=12 nodelay;
        limit_req_status 429;
        limit_conn probe_control_connections 8;
        limit_except GET { deny all; }
        default_type application/octet-stream;
        add_header Cache-Control no-store always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        alias /data/nginx/custom/probe-next/payload.bin;
    }
    location / { return 404; }
}
